name: SecureCloudOps DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit

      - name: Run Django automated tests
        run: python manage.py test

      - name: Bandit SAST Scan (Python Code)
        run: bandit -r dashboard secure_ops --severity-level high

      - name: Checkov IaC Scan (Terraform)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform

      - name: Build Docker image
        run: docker build -t securecloudops-ai .

      - - name: Trivy Base OS Scan (Advisory Warnings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "securecloudops-ai"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os"
          severity: "CRITICAL,HIGH"

      - name: Trivy Dependency Scan (Security Gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "securecloudops-ai"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "library"
          severity: "CRITICAL,HIGH"